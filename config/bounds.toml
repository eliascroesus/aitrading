# Pre-registered bounds for operator-proposed strategy variants. A proposal that
# touches a parameter not listed here, or leaves its range, is rejected in code.
# Ranges follow the robustness grid in docs/STRATEGY.md §10. Since 1.3.0 the
# operator may also choose the entry family of a sub-agent (same trend template,
# same exits, same risk limits; a different moment to buy).

["stocks.entry_mode"]
choices = ["reset_breakout", "template_cross", "high_breakout", "ma_pullback", "momentum_threshold"]

["crypto.entry_mode"]
choices = ["reset_breakout", "template_cross", "high_breakout", "ma_pullback", "momentum_threshold"]

["stocks.breakout_lookback"]
min = 20
max = 120

["crypto.breakout_lookback"]
min = 14
max = 120

["stocks.pullback_touch_bars"]
min = 1
max = 10

["crypto.pullback_touch_bars"]
min = 1
max = 10

["stocks.momentum_min"]
min = 0.1
max = 1.5

["crypto.momentum_min"]
min = 0.1
max = 1.5

["stocks.exit_closes_below_mid"]
min = 1
max = 1000

["crypto.exit_closes_below_mid"]
min = 1
max = 1000

["crypto.reset_z_max"]
min = 0.0
max = 0.8

["crypto.max_hold_bars"]
min = 30
max = 365

["stocks.impulse_window"]
min = 42
max = 126

["stocks.impulse_min_z"]
min = 1.0
max = 2.5

["stocks.reset_period"]
min = 15
max = 42

["stocks.reset_z_max"]
min = 0.0
max = 0.8

["stocks.pullback_max_atr"]
min = 4.0
max = 10.0

["stocks.trail_atr"]
min = 3.0
max = 10.0

["stocks.trail_atr_late"]
min = 2.0
max = 10.0

["stocks.failure_stop_bars"]
min = 10
max = 1000

["stocks.review_bars"]
min = 42
max = 252

["stocks.max_hold_bars"]
min = 63
max = 504

["stocks.min_pct_of_high"]
min = 0.6
max = 0.95

["stocks.volume_max_ratio"]
min = 0.7
max = 1.2

["crypto.trail_atr"]
min = 3.0
