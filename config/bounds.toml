# The strategy space the lab searches and the operator proposes in. A proposal that
# touches a parameter not listed here, or leaves its range, is rejected in code.
# Since 2.0.0 the sizing and concentration levers under risk.* are in the space and
# the evidence decides them. Since 2.2.0 their ranges run to 1.0 (a cap of 1.0 is no
# cap at all), and the lab also picks how risk per trade is set: a fixed share, or
# "edge" sizing, where each book risks what its own closed trades justify. The
# objective (a prop-firm pass rate, config [prop]) is what keeps these honest: a
# setting that risks too much fails its simulated evaluations and loses.
# Since 2.3.0 the lab also picks the direction per sleeve (long, short, or both; a
# short posts its full value from cash, so still no leverage), and the drawdown halt is
# out of the space: it applies with real money only, so backtests never pause.
# Leverage is not in the space: the backtester caps every order at cash, and the
# venue offers no margin at this size, so a leverage knob would test nothing real.

