# The firm's current configuration. One rule: grow the bankroll as fast as possible;
# death is the only hard stop. Everything below is a lever the evidence moves (2.0.0).
# Every change to this file is a change to the study and is recorded in git.
# Defaults mirror hive.config.StrategyConfig; tests assert they stay in sync.
#
# Changelog
#   1.0.0  2026-10-18  as briefed (docs/STRATEGY.md)
#   1.1.0  2026-10-18  stocks: SMA50 trend-break exit disabled, chandelier trail 5 ATR.
#                      The only lever that improved both walk-forward windows; adopted
#                      as "less bad", not as evidence of edge (docs/BACKTEST_RESULTS.md).
#   1.2.0  2026-10-18  universe: large-cap memecoins DOGE/SHIB/PEPE join the crypto sleeve
#                      under the same trend rules with a 10% position cap; paper sub-agents
#                      allowed from the survival tier (1) and base tier (2) instead of
#                      only from growth, since they cost nothing but compute. No change
#                      to entries, exits, sizing or limits.

#   1.3.0  2026-10-18  entry families: a sub-agent may run template_cross, high_breakout,
#                      ma_pullback or momentum_threshold instead of the pre-registered
#                      reset_breakout (same template, exits and limits); the operator picks
#                      them inside config/bounds.toml and keeps a research log of every test.
#                      The primary's own rule is unchanged (entry_mode = reset_breakout).

#   1.4.0  2026-10-19  governance by evidence: the operator promotes a sub-agent that has
#                      beaten the parent for the shadow period into the primary itself and
#                      reverts it if the pre-registered baseline wins back over 28 days.
#                      Monitors (news-channel sub-agents) and the daily sweep.

