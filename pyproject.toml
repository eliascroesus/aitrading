[project]
name = "hive"
version = "0.1.0"
description = "HIVE: a survival-constrained multi-agent AI trading system (public study)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=1.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "yfinance>=0.2.40",
    "alpaca-py>=0.30",
    "hyperliquid-python-sdk>=0.10",
    "feedparser>=6.0",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
hive = "hive.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hive"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer's `Option(...)` in defaults is the documented idiom.
"src/hive/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
