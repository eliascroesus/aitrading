name: daily-run

# Every day at 00:37 UTC: the US session closed at 21:00 UTC and the crypto
# UTC day closed at 00:00, so both sleeves see their latest *closed* bar. On
# weekends and US holidays only the crypto sleeve has a new bar and the stock
# sleeve is skipped automatically. Odd minute to dodge top-of-hour queueing.
# Paper by default: the run gets --live only when the HIVE_MODE secret is "live", and
# the code then also demands the confirmation phrase in HIVE_LIVE_CONFIRM —
# two deliberate human actions before real money moves.
#
# The price cache (data/) is not in git. It is carried from run to run with
# actions/cache; on a cold start scripts/bootstrap_data.sh fetches the small
# reference files and the network refresh rebuilds ~2.5 years of bars, which
# is enough for the signals. The weekly workflow adds the 2000-2020 history
# the operator's backtests need.
on:
  schedule:
    - cron: "37 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hive-state          # shared with weekly.yml: never two commits to state/ at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HIVE_MODE: ${{ secrets.HIVE_MODE || 'paper' }}
      HIVE_LIVE_CONFIRM: ${{ secrets.HIVE_LIVE_CONFIRM }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      HIVE_LLM_MODEL: ${{ vars.HIVE_LLM_MODEL || 'claude-opus-5-5' }}
      HIVE_LLM_CHEAP_MODEL: ${{ vars.HIVE_LLM_CHEAP_MODEL || 'claude-haiku-5-5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13 && uv pip install -e .
      - name: Restore the data cache from the previous run
        uses: actions/cache@v4
        with:
          path: data
          key: hive-data-${{ github.run_id }}
          restore-keys: hive-data-
      - name: Reference files (PIT S&P 500 membership, VIX, CoinMetrics) if missing
        run: bash scripts/bootstrap_data.sh
      - name: Refresh data cache (network sources)
        run: .venv/bin/hive data refresh --days 600 || echo "refresh failed; using cached data"
      - name: Daily cycle (paper unless secrets say otherwise)
        run: .venv/bin/hive run ${{ secrets.HIVE_MODE == 'live' && '--live' || '' }}
      - name: Heartbeat (live positions and prices for the dashboard)
        run: .venv/bin/hive watch || echo "heartbeat skipped"
      - name: Rebuild the dashboard
        run: .venv/bin/hive ui build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports/dashboard
      - name: Commit state and reports
        run: |
          git config user.name "hive-bot"
          git config user.email "hive-bot@users.noreply.github.com"
          git add state reports
          git diff --cached --quiet || git commit -m "daily run $(date -u +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

  # Commits made with GITHUB_TOKEN do not trigger other workflows, so pages.yml
  # would never see the bot's push: publish the dashboard from here instead.
  pages:
    needs: run
    if: ${{ always() && needs.run.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
