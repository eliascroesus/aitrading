name: hourly-lab-and-heartbeat

# Every hour, for most of the hour: the lab backtests the next cells of the
# strategy space in rounds of a few minutes (grid, then refinements around the
# best cells; no LLM, so it costs the firm nothing). After every round the
# heartbeat reads the broker, the dashboard is rebuilt and published, and the
# lab's records (reports/lab/, state/hive.json, state/research_log.jsonl) are
# committed, so the page and the record move every few minutes and the search
# continues where it stopped. GitHub's schedule can fire late; rounds keep the
# firm busy whenever the run actually starts. The daily and weekly runs share
# the hive-state group and queue behind a running session.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes of backtesting per round"
        default: "8"
      rounds:
        description: "Rounds this session (max 5 here)"
        default: "5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hive-state          # shared with daily.yml and weekly.yml: never two commits to state/ at once
  cancel-in-progress: false

env:
  MINUTES: ${{ github.event.inputs.minutes || '8' }}
  ROUNDS: ${{ github.event.inputs.rounds || '5' }}

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    environment:
      name: github-pages
    env:
      HIVE_MODE: ${{ secrets.HIVE_MODE || 'paper' }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: pyproject.toml
      - run: uv venv --python 3.13 && uv pip install -e .
      - name: Restore the data cache (read-only; the daily run refreshes and saves it)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: hive-data-
          restore-keys: hive-data-
      - name: Reference files + 2000-2020 history if the cache is cold
        run: bash scripts/bootstrap_data.sh --history || echo "bootstrap failed; the lab will use what is cached"
      - uses: actions/configure-pages@v5
      - uses: ./.github/actions/lab-round
        with: { minutes: "${{ env.MINUTES }}", round: "1", rounds: "${{ env.ROUNDS }}" }
      - uses: ./.github/actions/lab-round
        if: ${{ env.ROUNDS >= 2 }}
        with: { minutes: "${{ env.MINUTES }}", round: "2", rounds: "${{ env.ROUNDS }}" }
      - uses: ./.github/actions/lab-round
        if: ${{ env.ROUNDS >= 3 }}
        with: { minutes: "${{ env.MINUTES }}", round: "3", rounds: "${{ env.ROUNDS }}" }
      - uses: ./.github/actions/lab-round
        if: ${{ env.ROUNDS >= 4 }}
        with: { minutes: "${{ env.MINUTES }}", round: "4", rounds: "${{ env.ROUNDS }}" }
      - uses: ./.github/actions/lab-round
        if: ${{ env.ROUNDS >= 5 }}
        with: { minutes: "${{ env.MINUTES }}", round: "5", rounds: "${{ env.ROUNDS }}" }
