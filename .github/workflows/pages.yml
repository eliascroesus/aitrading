name: dashboard-pages

# Publishes reports/dashboard to GitHub Pages when a person pushes a rebuilt
# dashboard (the scheduled workflows deploy their own build directly, because a
# GITHUB_TOKEN push does not trigger this workflow).
# Enable Pages with "GitHub Actions" as the source in the repository settings.
on:
  push:
    paths: ["reports/dashboard/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports/dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
